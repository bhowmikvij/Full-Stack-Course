<script>
    // spread operator = ... allows am iterable such as an 
    //                   array or string to be expanded into 
    //                   seperate elements (unpacks the element)

    let fruits = ["apple", "banana", "orange"]
    let vegetables = ["okra", "potato", "galric"]

    let foods = [...fruits, ...vegetables, "eggs", "milk"]

    console.log(foods); // (8) ['apple', 'banana', 'orange', 'okra', 'potato', 'galric', 'eggs', 'milk']

</script>
