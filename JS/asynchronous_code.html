<script>
    // synchronus = Executes line by line consecutively in a sequential manner
    //              Code that waits for an operation to complete.

    // asynchronous = Allow multiple operations to be performed concurrently without waiting
    //                Doesn't block the execution flow and allows the program to continue
    //                (I/O operations, network requests, fetching data)
    //                Handled with: Callbacks, Promises, Async/Await

    function func1(callback){
        setTimeout(() => {console.log("Task 4"), 
                            callback()}, 3000); //setTimout is also a  type of async code 
    }
    
    function func2(){
        console.log("Task 1");
        console.log("Task 2");
        console.log("Task 3");
    }

    func1(func2) // Task 4
    //              Task 1
    //              Task 2
    //              Task 3



</script>
